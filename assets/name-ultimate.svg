<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
<title id="title">SAI SRINIVAS PATIBANDLA animated developer profile</title>
<desc id="desc">Animated neon developer header with a compact 3D developer avatar</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#030712"/><stop offset=".48" stop-color="#0A1020"/><stop offset="1" stop-color="#02131A"/></linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#60A5FA;#A78BFA;#34D399;#22D3EE" dur="7s" repeatCount="indefinite"/></stop><stop offset=".5" stop-color="#A78BFA"><animate attributeName="stop-color" values="#A78BFA;#34D399;#22D3EE;#60A5FA;#A78BFA" dur="7s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#34D399"><animate attributeName="stop-color" values="#34D399;#22D3EE;#60A5FA;#A78BFA;#34D399" dur="7s" repeatCount="indefinite"/></stop></linearGradient>
<linearGradient id="skin" x1=".2" y1="0" x2=".8" y2="1"><stop stop-color="#F2B18D"/><stop offset=".55" stop-color="#D88B68"/><stop offset="1" stop-color="#A95F46"/></linearGradient>
<linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24345F"/><stop offset=".55" stop-color="#101A35"/><stop offset="1" stop-color="#07101F"/></linearGradient>
<pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse"><path d="M70 0H0V70" fill="none" stroke="#334155" stroke-opacity=".18"/><circle cx="0" cy="0" r="1.4" fill="#38BDF8" opacity=".22"/></pattern>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
<linearGradient id="shine" x1="0" x2="1"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"><animate attributeName="offset" values=".2;.8;.2" dur="3.6s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>

<rect width="1400" height="420" rx="28" fill="url(#bg)"/>
<rect x="22" y="22" width="1356" height="376" rx="22" fill="url(#grid)"/>
<rect x="22" y="22" width="1356" height="376" rx="22" fill="none" stroke="#1E293B" stroke-width="2"/>
<ellipse cx="240" cy="220" rx="270" ry="180" fill="#22D3EE" opacity=".08" filter="url(#soft)"><animate attributeName="cx" values="240;1080;240" dur="10s" repeatCount="indefinite"/></ellipse>
<ellipse cx="1120" cy="250" rx="260" ry="150" fill="#8B5CF6" opacity=".07" filter="url(#soft)"/>

<g font-family="monospace">
<circle cx="58" cy="58" r="7" fill="#EF4444"/><circle cx="82" cy="58" r="7" fill="#F59E0B"/><circle cx="106" cy="58" r="7" fill="#22C55E"/>
<text x="132" y="64" fill="#64748B" font-size="16" letter-spacing="3">SAI@GITHUB / PROFILE / MAIN</text>
<text x="1240" y="64" fill="#334155" font-size="12" text-anchor="end">BUILD 2026.10</text>
<circle cx="1318" cy="59" r="5" fill="#34D399" filter="url(#glow)"><animate attributeName="opacity" values="1;.18;1" dur="1.2s" repeatCount="indefinite"/></circle>
</g>

<!-- Compact 3D-style avatar, proportioned for the existing 1400x420 header -->
<g transform="translate(48 78)">
<image href="./avatar-header-96.png" x="-4" y="-4" width="308" height="308" preserveAspectRatio="xMidYMid meet"/>
</g>
<rect x="48" y="78" width="300" height="304" rx="30" fill="none" stroke="url(#neon)" stroke-opacity=".35" stroke-width="2"/>

<g fill="none" opacity=".65">
<ellipse cx="850" cy="182" rx="500" ry="112" stroke="url(#neon)" stroke-width="2" stroke-dasharray="12 20"><animateTransform attributeName="transform" type="rotate" from="0 850 182" to="360 850 182" dur="18s" repeatCount="indefinite"/></ellipse>
<ellipse cx="850" cy="182" rx="445" ry="82" stroke="#22D3EE" stroke-opacity=".32" stroke-width="1.5" stroke-dasharray="3 15"><animateTransform attributeName="transform" type="rotate" from="360 850 182" to="0 850 182" dur="12s" repeatCount="indefinite"/></ellipse>
</g>

<g font-family="monospace">
<text x="372" y="112" fill="#22D3EE" font-size="18">$</text><text x="392" y="112" fill="#94A3B8" font-size="18">identity --render</text>
<rect x="566" y="96" width="11" height="22" rx="2" fill="#34D399"><animate attributeName="opacity" values="1;0;1" dur=".75s" repeatCount="indefinite"/></rect>
</g>

<!-- Animated name -->
<g font-family="monospace" font-weight="800" font-size="54" text-anchor="middle" letter-spacing="1">
<text x="850" y="192" fill="#FF2E88" opacity=".42">SAI SRINIVAS PATIBANDLA<animate attributeName="x" values="850;842;858;850;850" dur="2.6s" repeatCount="indefinite"/><animate attributeName="y" values="192;188;195;192;192" dur="2.6s" repeatCount="indefinite"/></text>
<text x="850" y="192" fill="#00E5FF" opacity=".42">SAI SRINIVAS PATIBANDLA<animate attributeName="x" values="850;859;844;850;850" dur="2.1s" repeatCount="indefinite"/></text>
<text x="850" y="192" fill="url(#neon)" stroke="#E0F2FE" stroke-opacity=".3" stroke-width="1.2" filter="url(#glow)">SAI SRINIVAS PATIBANDLA</text>
<text x="850" y="192" fill="url(#shine)" opacity=".9">SAI SRINIVAS PATIBANDLA</text>
<rect x="350" y="142" width="1000" height="2" fill="#FFFFFF" opacity=".4"/><rect x="350" y="205" width="1000" height="2" fill="#22D3EE" opacity=".5"/>
</g>

<g transform="translate(420 225)">
<path d="M0 18 C80 -2 130 32 210 10 S370 2 440 18 S590 30 770 9" fill="none" stroke="#1E293B" stroke-width="4"/>
<path d="M0 18 C80 -2 130 32 210 10 S370 2 440 18 S590 30 770 9" fill="none" stroke="url(#neon)" stroke-width="3" stroke-linecap="round" stroke-dasharray="18 14"><animate attributeName="stroke-dashoffset" values="0;-128" dur="1.6s" repeatCount="indefinite"/></path>
</g>

<text x="850" y="292" text-anchor="middle" fill="#CBD5E1" font-family="monospace" font-size="18" letter-spacing="3">FULL-STACK  •  BACKEND  •  AI / ML  •  CLOUD<animate attributeName="fill" values="#CBD5E1;#67E8F9;#C4B5FD;#A7F3D0;#CBD5E1" dur="5.5s" repeatCount="indefinite"/></text>

<g font-family="monospace">
<text x="92" y="338" fill="#64748B" font-size="12">STATUS</text><rect x="151" y="322" width="86" height="28" rx="14" fill="#062A20" stroke="#34D399" stroke-opacity=".6"/><circle cx="169" cy="336" r="4" fill="#34D399"><animate attributeName="opacity" values="1;.3;1" dur="1.1s" repeatCount="indefinite"/></circle><text x="182" y="340" fill="#A7F3D0" font-size="11">BUILDING</text>
<text x="272" y="338" fill="#475569" font-size="12">PIPELINE</text><path d="M344 335h156" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/><path d="M344 335h82" stroke="url(#neon)" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 10"><animate attributeName="stroke-dashoffset" values="0;-60" dur=".9s" repeatCount="indefinite"/></path>
<text x="1200" y="338" fill="#475569" font-size="12">BUILD → DEBUG → SHIP</text><text x="1308" y="338" fill="#34D399" font-size="12" text-anchor="end">READY</text>
</g>
</svg>