<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="467" viewBox="0 0 1400 467" role="img" aria-labelledby="title desc">
<title id="title">SAI SRINIVAS PATIBANDLA neon software developer portfolio banner</title>
<desc id="desc">Animated futuristic developer banner with neon graphics, holographic panels, developer avatar, laptop and robot.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#020617"/><stop offset=".48" stop-color="#06122A"/><stop offset="1" stop-color="#040018"/>
  </linearGradient>
  <radialGradient id="aurora" cx=".5" cy=".45" r=".75">
    <stop offset="0" stop-color="#1D4ED8" stop-opacity=".28"/><stop offset=".55" stop-color="#7C3AED" stop-opacity=".13"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="cyanPink" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#22D3EE"/><stop offset=".45" stop-color="#60A5FA"/><stop offset=".72" stop-color="#C084FC"/><stop offset="1" stop-color="#F0ABFC"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#F8FAFC"/><stop offset=".18" stop-color="#CBD5E1"/><stop offset=".48" stop-color="#64748B"/><stop offset=".7" stop-color="#F8FAFC"/><stop offset="1" stop-color="#94A3B8"/>
  </linearGradient>
  <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#1E3A8A"/><stop offset=".4" stop-color="#111827"/><stop offset="1" stop-color="#030712"/>
  </linearGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#F6C2A1"/><stop offset=".55" stop-color="#D9906F"/><stop offset="1" stop-color="#9A5C49"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0H0V46" fill="none" stroke="#38BDF8" stroke-opacity=".12"/><circle cx="0" cy="0" r="1" fill="#67E8F9" opacity=".18"/></pattern>
  <linearGradient id="sweep" x1="0" x2="1"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".48" stop-color="#fff" stop-opacity=".9"><animate attributeName="offset" values=".1;.85;.1" dur="3.2s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>

<rect width="1400" height="467" rx="30" fill="url(#bg)"/>
<rect width="1400" height="467" rx="30" fill="url(#aurora)"/>
<rect x="18" y="18" width="1364" height="431" rx="24" fill="url(#grid)"/>
<rect x="18" y="18" width="1364" height="431" rx="24" fill="none" stroke="#1E3A5F" stroke-width="2"/>

<!-- ambient light -->
<ellipse cx="250" cy="245" rx="310" ry="210" fill="#0EA5E9" opacity=".07" filter="url(#softglow)">
  <animate attributeName="cx" values="250;360;250" dur="8s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="1140" cy="250" rx="290" ry="180" fill="#7C3AED" opacity=".08" filter="url(#softglow)">
  <animate attributeName="cy" values="250;210;250" dur="6s" repeatCount="indefinite"/>
</ellipse>

<!-- top chrome -->
<g font-family="monospace">
  <circle cx="48" cy="48" r="7" fill="#EF4444"/><circle cx="72" cy="48" r="7" fill="#F59E0B"/><circle cx="96" cy="48" r="7" fill="#22C55E"/>
  <text x="122" y="54" fill="#64748B" font-size="13" letter-spacing="3">SAI.DEV / PORTFOLIO / MAIN</text>
  <text x="1350" y="54" text-anchor="end" fill="#475569" font-size="11">LIVE PROFILE SIGNAL</text>
  <circle cx="1370" cy="48" r="5" fill="#34D399" filter="url(#glow)"><animate attributeName="opacity" values="1;.2;1" dur="1.1s" repeatCount="indefinite"/></circle>
</g>

<!-- left youthful futuristic developer avatar -->
<g transform="translate(40 86)">
  <defs>
    <linearGradient id="avatarSuitYoung" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172554"/><stop offset=".5" stop-color="#0F172A"/><stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="avatarSkinYoung" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFD1B5"/><stop offset=".5" stop-color="#E9A27F"/><stop offset="1" stop-color="#B96E58"/>
    </linearGradient>
  </defs>

  <ellipse cx="154" cy="334" rx="128" ry="20" fill="#22D3EE" opacity=".14" filter="url(#softglow)"/>

  <!-- hoodie -->
  <path d="M22 338 Q30 256 86 216 Q119 194 154 194 Q189 194 222 216 Q278 256 286 338Z"
        fill="url(#avatarSuitYoung)" stroke="#22D3EE" stroke-width="3" stroke-opacity=".7"/>
  <path d="M92 214 Q122 246 154 276 Q186 246 216 214 L204 338 H104Z"
        fill="#091226"/>
  <path d="M112 224 Q130 248 154 270 Q178 248 196 224" fill="none" stroke="#60A5FA" stroke-width="3"/>
  <path d="M128 238 L154 270 L180 238" fill="none" stroke="#22D3EE" stroke-width="2" opacity=".7"/>

  <!-- hoodie strings -->
  <path d="M133 230 Q129 254 133 272" fill="none" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  <path d="M175 230 Q179 254 175 272" fill="none" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  <circle cx="133" cy="273" r="3" fill="#22D3EE"/>
  <circle cx="175" cy="273" r="3" fill="#22D3EE"/>

  <!-- neck -->
  <path d="M135 168 H173 V207 Q154 219 135 207Z" fill="url(#avatarSkinYoung)"/>

  <!-- youthful face -->
  <path d="M108 80 Q110 34 154 22 Q198 34 200 80 L194 144 Q186 173 154 181 Q122 173 114 144Z"
        fill="url(#avatarSkinYoung)" stroke="#F8C4A7" stroke-opacity=".35" stroke-width="2"/>

  <!-- modern textured hair -->
  <path d="M106 87 Q96 41 121 22 Q139 7 164 12 Q194 16 204 50 Q208 68 201 88 Q186 66 169 58 Q150 65 130 61 Q117 58 106 66Z"
        fill="#0B1020"/>
  <path d="M112 44 Q128 20 153 19 Q181 18 197 42 Q174 33 156 39 Q136 45 112 44Z"
        fill="#26324A"/>
  <path d="M125 30 Q139 17 157 16" fill="none" stroke="#36445E" stroke-width="4" stroke-linecap="round" opacity=".7"/>

  <!-- clean brows -->
  <path d="M119 92 Q130 85 141 91" fill="none" stroke="#56382E" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M167 91 Q178 85 189 92" fill="none" stroke="#56382E" stroke-width="3.5" stroke-linecap="round"/>

  <!-- lively eyes -->
  <ellipse cx="130" cy="101" rx="8.5" ry="6.5" fill="#1B2430"/>
  <ellipse cx="178" cy="101" rx="8.5" ry="6.5" fill="#1B2430"/>
  <circle cx="132" cy="99" r="2.6" fill="#F8FAFC"/>
  <circle cx="180" cy="99" r="2.6" fill="#F8FAFC"/>
  <circle cx="132" cy="100" r="1.1" fill="#111827"/>
  <circle cx="180" cy="100" r="1.1" fill="#111827"/>

  <!-- small nose -->
  <path d="M154 101 Q150 115 153 121 Q156 123 160 121" fill="none" stroke="#B56D53" stroke-width="2.2" stroke-linecap="round"/>

  <!-- youthful smile, no facial hair -->
  <path d="M144 139 Q154 146 164 139" fill="none" stroke="#844A40" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M149 143 Q154 146 159 143" fill="none" stroke="#FFD7C4" stroke-width="1.5" stroke-linecap="round" opacity=".55"/>

  <!-- subtle cheek highlights -->
  <path d="M120 123 Q127 131 134 133" fill="none" stroke="#FFDCC9" stroke-opacity=".25" stroke-width="4" stroke-linecap="round"/>
  <path d="M188 123 Q181 131 174 133" fill="none" stroke="#9E5A47" stroke-opacity=".18" stroke-width="4" stroke-linecap="round"/>

  <!-- neon headset -->
  <path d="M104 84 Q103 38 154 27 Q205 38 204 84" fill="none" stroke="#38BDF8" stroke-width="5" opacity=".75"/>
  <rect x="97" y="89" width="14" height="34" rx="7" fill="#111827" stroke="#22D3EE"/>
  <rect x="197" y="89" width="14" height="34" rx="7" fill="#111827" stroke="#22D3EE"/>

  <!-- dev badge -->
  <rect x="136" y="294" width="36" height="20" rx="6" fill="#020617" stroke="#22D3EE"/>
  <text x="154" y="308" text-anchor="middle" fill="#67E8F9" font-family="monospace" font-size="9">DEV</text>

  <circle cx="222" cy="62" r="5" fill="#34D399" filter="url(#glow)">
    <animate attributeName="opacity" values="1;.15;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <text x="154" y="357" text-anchor="middle" fill="#67E8F9" font-family="monospace" font-size="11" letter-spacing="2">
    BUILD • LEARN • IMPROVE
  </text>
</g>

<!-- laptop -->
<g transform="translate(18 342)">
  <rect x="70" y="0" width="272" height="76" rx="9" fill="#0B1220" stroke="#334155" stroke-width="2"/>
  <rect x="82" y="12" width="248" height="52" rx="6" fill="#020617" stroke="#22D3EE" stroke-opacity=".35"/>
  <circle cx="206" cy="37" r="17" fill="#111827" stroke="#60A5FA" stroke-width="2"/>
  <path d="M206 23c-8 0-14 6-14 14 0 7 5 13 12 14v-6h-4v-4h4v-3c0-4 2-6 6-6 2 0 4 .3 4 .3v4h-2c-2 0-3 .9-3 3v2h5l-1 4h-4v6c7-1 12-7 12-14 0-8-6-14-15-14z" fill="#fff"/>
  <path d="M40 76 Q206 100 372 76 L354 92 H58Z" fill="#111827" stroke="#334155"/>
</g>

<!-- center title and rings -->
<g>
  <text x="775" y="118" text-anchor="middle" fill="#E2E8F0" font-family="monospace" font-size="17" letter-spacing="7">HELLO, I'M</text>
  <line x1="510" y1="108" x2="650" y2="108" stroke="url(#cyanPink)" stroke-width="3"/><line x1="900" y1="108" x2="1040" y2="108" stroke="url(#cyanPink)" stroke-width="3"/>
  <ellipse cx="775" cy="215" rx="410" ry="104" fill="none" stroke="url(#cyanPink)" stroke-width="2" stroke-dasharray="22 13">
    <animateTransform attributeName="transform" type="rotate" from="0 775 215" to="360 775 215" dur="14s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="775" cy="215" rx="365" ry="84" fill="none" stroke="#22D3EE" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="5 11">
    <animateTransform attributeName="transform" type="rotate" from="360 775 215" to="0 775 215" dur="9s" repeatCount="indefinite"/>
  </ellipse>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="900" text-anchor="middle">
    <text x="775" y="208" fill="#00E5FF" opacity=".32" font-size="66"><animate attributeName="x" values="775;768;782;775" dur="2.1s" repeatCount="indefinite"/>SAI SRINIVAS</text>
    <text x="775" y="208" fill="#FF2E88" opacity=".28" font-size="66"><animate attributeName="x" values="775;782;768;775" dur="2.4s" repeatCount="indefinite"/>SAI SRINIVAS</text>
    <text x="775" y="208" fill="url(#cyanPink)" stroke="#E0F2FE" stroke-width="1.5" font-size="66" filter="url(#glow)">SAI SRINIVAS</text>
    <text x="775" y="272" fill="#F8FAFC" font-size="57" letter-spacing="7">PATIBANDLA</text>
    <rect x="430" y="292" width="690" height="3" fill="url(#cyanPink)" opacity=".8"/>
    <rect x="420" y="190" width="720" height="70" fill="url(#sweep)" opacity=".15">
      <animate attributeName="x" values="380;780;1180;380" dur="4.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="775" y="327" text-anchor="middle" fill="#CBD5E1" font-family="monospace" font-size="16" letter-spacing="6">SOFTWARE DEVELOPER</text>
</g>

<!-- right holographic panels -->
<g font-family="monospace">
  <g transform="translate(1075 78)">
    <rect width="268" height="100" rx="14" fill="#031126" fill-opacity=".85" stroke="#22D3EE" stroke-width="1.5"/>
    <circle cx="22" cy="22" r="5" fill="#EF4444"/><circle cx="40" cy="22" r="5" fill="#F59E0B"/><circle cx="58" cy="22" r="5" fill="#22C55E"/>
    <text x="78" y="26" fill="#67E8F9" font-size="12">developer --me</text>
    <text x="18" y="55" fill="#C084FC" font-size="13">&gt; Build</text>
    <text x="18" y="74" fill="#22D3EE" font-size="13">&gt; Solve</text>
    <text x="128" y="55" fill="#A7F3D0" font-size="13">&gt; Learn</text>
    <text x="128" y="74" fill="#FDE68A" font-size="13">&gt; Grow</text>
    <path d="M245 87 H264" stroke="#22D3EE" stroke-width="2"><animate attributeName="opacity" values="1;.2;1" dur=".8s" repeatCount="indefinite"/></path>
  </g>

  <g transform="translate(1110 197)">
    <rect width="235" height="45" rx="12" fill="#030A17" stroke="#22D3EE" stroke-opacity=".7"/>
    <text x="18" y="29" fill="#67E8F9" font-size="14">▣</text><text x="48" y="29" fill="#E2E8F0" font-size="14">FULL-STACK</text>
    <rect x="0" y="55" width="235" height="45" rx="12" fill="#030A17" stroke="#A78BFA" stroke-opacity=".7"/>
    <text x="18" y="87" fill="#C084FC" font-size="14">◉</text><text x="48" y="87" fill="#E2E8F0" font-size="14">AI / ML</text>
    <rect x="0" y="110" width="235" height="45" rx="12" fill="#030A17" stroke="#60A5FA" stroke-opacity=".7"/>
    <text x="18" y="142" fill="#60A5FA" font-size="14">▤</text><text x="48" y="142" fill="#E2E8F0" font-size="14">BACKEND</text>
    <rect x="0" y="165" width="235" height="45" rx="12" fill="#030A17" stroke="#34D399" stroke-opacity=".7"/>
    <text x="18" y="197" fill="#34D399" font-size="14">☁</text><text x="48" y="197" fill="#E2E8F0" font-size="14">CLOUD</text>
  </g>
</g>

<!-- robot -->
<g transform="translate(1210 345)">
  <ellipse cx="74" cy="72" rx="78" ry="13" fill="#22D3EE" opacity=".22" filter="url(#softglow)"/>
  <rect x="28" y="6" width="94" height="62" rx="22" fill="#111827" stroke="#60A5FA" stroke-width="3"/>
  <rect x="40" y="18" width="70" height="38" rx="15" fill="#020617" stroke="#22D3EE" stroke-opacity=".7"/>
  <circle cx="61" cy="37" r="6" fill="#E0F2FE" filter="url(#glow)"/><circle cx="89" cy="37" r="6" fill="#E0F2FE" filter="url(#glow)"/>
  <path d="M74 6V-5" stroke="#60A5FA" stroke-width="3"/><circle cx="74" cy="-9" r="5" fill="#F0ABFC" filter="url(#glow)"/>
  <path d="M38 70 L24 88 M112 70 L126 88" stroke="#60A5FA" stroke-width="5" stroke-linecap="round"/>
  <path d="M20 30 L7 20 M128 30 L141 20" stroke="#22D3EE" stroke-width="5" stroke-linecap="round"/>
  <animateTransform attributeName="transform" type="translate" values="1210 345;1210 338;1210 345" dur="2.6s" repeatCount="indefinite"/>
</g>

<!-- bottom workflow -->
<g transform="translate(505 362)" font-family="monospace">
  <text x="0" y="0" fill="#64748B" font-size="11">PIPELINE</text>
  <line x1="72" y1="-4" x2="480" y2="-4" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
  <line x1="72" y1="-4" x2="190" y2="-4" stroke="url(#cyanPink)" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 12"><animate attributeName="stroke-dashoffset" values="0;-90" dur="1s" repeatCount="indefinite"/></line>
  <text x="515" y="0" fill="#34D399" font-size="11">READY TO SHIP</text>
</g>

<!-- floating circuitry -->
<g fill="none" stroke="url(#cyanPink)" stroke-width="1.4" opacity=".7">
  <path d="M355 116 H435 V82 H475"/><circle cx="475" cy="82" r="4" fill="#22D3EE"/>
  <path d="M1040 335 H1085 V390 H1140"/><circle cx="1140" cy="390" r="4" fill="#C084FC"/>
  <path d="M980 135 H1020 V88 H1050"/><circle cx="1050" cy="88" r="4" fill="#22D3EE"/>
  <path d="M375 315 H420 V370 H475"/><circle cx="475" cy="370" r="4" fill="#F0ABFC"/>
</g>

<!-- animated scanlines -->
<g opacity=".12">
  <rect x="20" y="20" width="1360" height="2" fill="#67E8F9"><animate attributeName="y" values="30;430;30" dur="5.5s" repeatCount="indefinite"/></rect>
</g>
</svg>